<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Weather</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <!-- ① 상단 바 -->
    <nav class="navbar bg-body border-bottom">
        <div class="container gap-3">
            <span class="navbar-brand fw-semibold mb-0"><i class="bi bi-cloud-sun text-primary me-2"></i>World Weather</span>
            <!-- 전 세계 도시 검색 (Enter로 검색) -->
            <form class="city-search" id="searchForm" role="search" autocomplete="off">
                <i class="bi bi-search search-icon" aria-hidden="true"></i>
                <input type="search" class="form-control form-control-sm rounded-pill" id="searchInput" placeholder="도시 검색" aria-label="도시 검색">
                <div class="list-group search-results shadow" id="searchResults" hidden></div>
            </form>
        </div>
    </nav>

    <main class="container py-4">
        <!-- ② 대륙 탭 + ③ 나라 선택 (한 줄) -->
        <div class="d-flex flex-wrap align-items-center gap-2 mb-4">
            <ul class="nav nav-pills continent-tabs" id="continentTabs"></ul>
            <select class="form-select form-select-sm country-select ms-lg-auto" id="countrySelect" aria-label="나라 선택"></select>
        </div>

        <div class="row g-4">
            <!-- ⑤ 상세 날씨 + ⑥ 지도 (모바일은 위, PC는 오른쪽) -->
            <div class="col-lg-5 order-first order-lg-last">
                <div class="side-panel">
                    <section class="detail-panel" id="detailPanel" aria-live="polite"></section>
                    <section class="card shadow-sm mt-3 overflow-hidden">
                        <div class="card-header small fw-semibold"><i class="bi bi-geo-alt me-1"></i>위치</div>
                        <div class="weather-map" id="weatherMap"></div>
                    </section>
                </div>
            </div>

            <!-- ④ 도시 카드 -->
            <div class="col-lg-7">
                <div class="row row-cols-2 row-cols-md-3 g-3" id="cityGrid"></div>
                <!-- 다른 도시 (누르면 그때 날씨를 불러온다) -->
                <section class="mt-4" id="moreCities"></section>
            </div>
        </div>
    </main>

    <footer class="container pb-4 small text-body-secondary">
        Weather data by <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeather</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/cities.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
