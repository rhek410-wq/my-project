<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 생성기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light">
    <!-- ① 상단 바 -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-bold"><i class="bi bi-stars"></i> 로또 번호 생성기</span>
        </div>
    </nav>

    <main class="container py-4">
        <!-- ② 지난주 당첨번호 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h6 fw-bold mb-3">
                    지난주 당첨번호 <span class="text-secondary fw-normal" id="drawInfo"></span>
                </h2>
                <div class="d-flex flex-wrap align-items-center gap-3">
                    <div class="balls" id="drawBalls"></div>
                    <div class="ms-md-auto text-secondary small" id="drawPrize"></div>
                </div>
                <p class="text-secondary small mt-2 mb-0 d-none" id="drawWarning">
                    <i class="bi bi-info-circle"></i> 최신 회차 정보가 아닐 수 있어요
                </p>
            </div>
        </div>

        <div class="row g-4">
            <!-- ③ 번호 선택 -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h6 fw-bold mb-3">번호 선택</h2>

                        <div class="btn-group w-100 mb-2" role="group">
                            <button type="button" class="btn btn-primary" id="pickModeBtn">
                                <i class="bi bi-hand-index"></i> 수동 번호
                            </button>
                            <button type="button" class="btn btn-outline-danger" id="excludeModeBtn">
                                <i class="bi bi-slash-circle"></i> 제외 번호
                            </button>
                        </div>
                        <p class="text-secondary small mb-3" id="modeHint"></p>

                        <div class="number-grid" id="numberGrid"></div>

                        <div class="small my-3">
                            <div>수동: <b id="pickedText">없음</b></div>
                            <div>제외: <b id="excludedText">없음</b></div>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="button" class="btn btn-primary btn-sm" id="addManualBtn">
                                <i class="bi bi-plus-lg"></i> 수동 게임 추가
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="clearPickedBtn">수동 초기화</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="clearExcludedBtn">제외 초기화</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <!-- ④ 수동 게임 목록 -->
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <h2 class="h6 fw-bold mb-1">수동 게임 (<span id="manualCount">0</span>/5)</h2>
                        <p class="text-secondary small mb-2">6개 미만으로 고르면 나머지는 자동으로 채워져요 (반자동).</p>
                        <ul class="list-group list-group-flush" id="manualList"></ul>
                    </div>
                </div>

                <!-- ⑤ 번호 생성 -->
                <button type="button" class="btn btn-primary btn-lg w-100 mb-3 fw-bold" id="generateBtn">
                    <i class="bi bi-shuffle"></i> 번호 생성
                </button>

                <!-- ⑥ 생성 결과 -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h2 class="h6 fw-bold mb-0">생성 결과</h2>
                            <button type="button" class="btn btn-outline-danger btn-sm" id="resetAllBtn">
                                <i class="bi bi-arrow-counterclockwise"></i> 전체 초기화
                            </button>
                        </div>
                        <ul class="list-group list-group-flush" id="resultList"></ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 안내 메시지 -->
    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
        <div class="toast align-items-center text-bg-dark border-0" id="messageToast" role="alert" aria-live="assertive">
            <div class="d-flex">
                <div class="toast-body" id="messageText"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="닫기"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
