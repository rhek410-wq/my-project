<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            border: 1px solid black;
            width: 400px;
            height: 350px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title {
            text-align: center; 
            font-size: 50;   
            font-weight: bold; 
            padding-top: 20px; 
            margin-bottom:50px;
        }

        input {
            width: 300px;
            height: 40px;
            border-radius: 2px;
            border: 0; 
            border-bottom: 1px solid rgb(255, 253, 253); 
            outline: 0; 
            margin-top: 10px;
        }

        .btn{
               margin-top: 25px;
        }

        .ok-btn{
            width: 90px;
            height: 40px;
            font-size: 20px;
            font-weight: bold;
            color : white;
            background-color: #959496;
            border: 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="title">
                Login
            </div>
            <div>
                <input type="text" placeholder="ID">
            </div>
             <div>
                <input type="text" placeholder="PASSWORD">
            </div>
            <div class="btn">
                <button type="button" class="ok-btn">로그인</button>
            </div>
        </div>
    </div>
</body>
</html>
